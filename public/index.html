<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codveda Level 3 - Auth & Real-Time Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Register / Login Box -->
        <div id="auth-box" class="card">
            <h2 id="form-title">Login</h2>
            
            <form id="auth-form">
                <div class="input-group" id="username-group" style="display: none;">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="Enter email">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>

                <div class="input-group" id="role-group" style="display: none;">
                    <label>Role</label>
                    <select id="role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn">Login</button>
            </form>

            <p class="toggle-text">
                <span id="toggle-msg">Don't have an account?</span> 
                <a href="#" id="toggle-btn">Register here</a>
            </p>
        </div>

        <!-- Dashboard View with Live Chat -->
        <div id="dashboard-box" class="card" style="display: none;">
            <h2>Welcome, <span id="user-display-name"></span>!</h2>
            <p>Your Role: <strong id="user-display-role"></strong></p>

            <div id="role-content">
                <!-- Javascript හරහා User / Admin content මෙතනට වැටේ -->
            </div>

            <!-- Live Chat / Announcement Section -->
            <div id="chat-box" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
                <h3>💬 Live Announcement & Chat</h3>
                <div id="messages" style="height: 150px; overflow-y: auto; background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px;"></div>
                <form id="chat-form" style="display: flex; gap: 5px;">
                    <input type="text" id="msg-input" placeholder="Type a message..." required style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                    <button type="submit" style="width: auto; padding: 8px 15px; margin-top: 0;">Send</button>
                </form>
            </div>

            <button id="logout-btn" style="margin-top: 15px;">Logout</button>
        </div>
    </div>

    <!-- Socket.io Client Script and Custom Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="Script.js"></script>
</body>
</html>
